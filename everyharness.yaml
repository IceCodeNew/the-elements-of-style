name: elements-of-style
version: 2.0.0
description: Writing skills for technical and personal text, with English, Japanese and Chinese extensions
author:
  name: IceCodeNew
  url: https://github.com/IceCodeNew
license: See NOTICE.md in each skill directory
repository: https://github.com/IceCodeNew/the-elements-of-style
homepage: https://github.com/IceCodeNew/the-elements-of-style
keywords:
  - writing
  - style
  - technical-writing
  - composition
  - clarity
  - japanese
  - chinese
# Every harness everyharness targets discovers skills natively, and each skill
# has a description that says when to invoke it. A session-start injection
# would buy nothing and cost context in every session.
bootstrap: none
# Claude Code installs each skill as its own plugin from the hand-written
# .claude-plugin/marketplace.json, so a user can pick a genre skill and the
# language skills they need. everyharness generates one plugin per repository.
# Codex, Droid and Grok install the one generated plugin from the
# agents-marketplace descriptor.
# everyharness 1.0.0 writes `muse plugins approve superpowers` into the muse
# install doc for every plugin, so that doc gives a wrong command.
harnesses:
  exclude:
    - claude-code
    - muse
